name: Release
run-name: ${{ github.ref_name }} release build 🚀

# A run on a tag ref builds Windows and macOS and creates a draft Release.
# tag-release.yaml dispatches this workflow on the tag of a merged version bump, and a
# tag pushed by hand starts it through the push: tags trigger. A dispatch on a branch
# only builds.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-event:
    name: Check Release Tag ☑️
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      validTag: ${{ steps.check.outputs.validTag }}
    steps:
      # For build/release-tag.cjs, at the tag this run builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.ref_type == 'tag'

      - name: Check Tag ☑️
        id: check
        run: |
          : Check Release Tag
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # A tag push, or a dispatch on a tag ref (tag-release.yaml), releases.
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'validTag=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prerelease=$(node build/release-tag.cjs shape "${GITHUB_REF_NAME}") && status=0 || status=$?
          case "${status}:${prerelease}" in
            0:true | 0:false )
              echo 'validTag=true' >> "$GITHUB_OUTPUT"
              echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
            3: )
              echo 'validTag=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::the release tag check did not run (exit ${status})"
              exit 1
              ;;
          esac

  build-windows:
    name: Build for Windows 🪟
    needs: check-event
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set Up Node.js 🔧
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies 📦
        run: npm ci

      - name: Run Tests ✅
        run: npm test

      - name: Build Windows Installer 🧱
        run: npm run dist:win

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jimaku-translator-windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    name: Build for macOS 🍏
    needs: check-event
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set Up Node.js 🔧
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies 📦
        run: npm ci

      - name: Run Tests ✅
        run: npm test

      - name: Check Signing Secrets 🔑
        id: check-signing
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
        run: |
          if [[ -n "$CERT" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_SIGNING_CERT not set — building unsigned DMG"
          fi

      - name: Import Apple Developer ID Certificate 🔑
        if: steps.check-signing.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          # Import the cert into a persistent keychain so both electron-builder
          # and notarize-dmg.cjs can find the signing identity. electron-builder's
          # built-in CSC_LINK path uses a temp keychain that is destroyed before
          # notarize-dmg.cjs runs, which caused "item not found in keychain" errors.
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Prepend our keychain to the search list so codesign finds the identity
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          rm "$RUNNER_TEMP/cert.p12"

          echo '--- Signing identities ---'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS DMG (signed + notarized) 🧱
        if: steps.check-signing.outputs.signed == 'true'
        run: npm run dist:mac
        env:
          # Cert is already in the default keychain search list; don't pass
          # CSC_LINK so electron-builder won't create a temp keychain that
          # would hide the identity from notarize-dmg.cjs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}

      - name: Build macOS DMG (unsigned) 🧱
        if: steps.check-signing.outputs.signed == 'false'
        run: npm run dist:mac:unsigned

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jimaku-translator-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  create-release:
    name: Create Release 🛫
    needs: [check-event, build-windows, build-macos]
    if: needs.check-event.outputs.validTag == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft Release
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release 🛫
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.4
        with:
          draft: true
          prerelease: ${{ needs.check-event.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.check-event.outputs.version }}
          name: ${{ needs.check-event.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/latest-mac.yml
