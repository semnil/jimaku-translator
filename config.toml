[vban]
port = 6980
stream_name = ""            # empty = accept all streams

[obs]
host = "127.0.0.1"
port = 4455
password = ""
source_ja = ""
source_en = ""

[whisper]
server = "http://127.0.0.1:8080"
binary = ""                 # path to whisper-server binary (empty = manual management)
model = ""                  # path to GGML model file (required when binary is set)
# threads = 4               # whisper-server --threads (when omitted, decided automatically from the platform/GPU)

[subtitle]
clear_delay = 6.0
chars_per_line = 0

[vad]
threshold = 0.5
min_speech_ms = 500
max_speech_ms = 10000

[audio]
rms_gate_db = -60                 # RMS gate threshold (dBFS); VAD is skipped below this
normalize_target_dbfs = -6        # normalization target for speech segments (dBFS); 0 = disabled
adaptive_gate_enabled = false     # track the noise floor and raise the gate automatically
adaptive_gate_margin_db = 6       # margin added to the estimated noise floor (dB)
adaptive_gate_window_sec = 10     # tracking window of the noise floor estimate (seconds)
adaptive_gate_max_db = -30        # upper limit of the adaptive gate (dBFS); prevents runaway feedback

[ui]
language = ""               # "" = auto-detect from system, "en" or "ja" to override
show_vad_debug = false      # overlay the VAD debug display (prob/threshold/diag) on the graph
